name: agrivision_flutter
description: AgriVision DA staff workspace built with Flutter.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.1.1
  image: ^4.5.4
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - branding/agrivision_icon.png
    - branding/agrivision_mark.png
