<!-- Agrivission splash screen. Paste this whole block at the top of the app's main HTML (inside <body>).
     The app calls AgrivisionSplash.ready() when its first data has loaded. Without that call it hides itself after 4.5 s. -->
<div id="ag-splash" aria-label="Agrivission">
<style>
#ag-splash{position:fixed;inset:0;z-index:99999;background:#fff;overflow:hidden;opacity:1;transition:opacity .45s ease}
#ag-splash.ag-out{opacity:0;pointer-events:none}
#ag-splash .ag-scene{position:absolute;left:0;width:1438px;height:661px;top:50%;margin-top:-330px;transform-origin:0 50%;perspective:1700px;perspective-origin:50% 45%}
#ag-splash .ag-sway,#ag-splash .ag-piece{transform-style:preserve-3d}
#ag-splash .ag-sway{position:absolute;inset:0;will-change:transform}
#ag-splash .ag-piece{position:absolute;will-change:transform}
#ag-splash .ag-piece i{position:absolute;inset:0;background-image:var(--src);background-size:100% 100%}
#ag-splash .ag-leaf{transform-origin:20% 100%}
#ag-splash .ag-ltr{transform-origin:50% 100%}
#ag-splash .ag-shadow{position:absolute;left:14%;right:14%;top:84%;height:11%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(3,66,40,.22),rgba(3,66,40,0) 70%);animation:ag-fade 1s 1s ease both}
#ag-splash .ag-sway{animation:ag-intro 2.1s cubic-bezier(.2,.7,.2,1) both,ag-idle 7s 2.1s ease-in-out infinite alternate}
#ag-splash .ag-leaf{animation:ag-grow 1.2s .15s cubic-bezier(.25,1.25,.4,1) both,ag-bob 4s 1.7s ease-in-out infinite}
#ag-splash .ag-ltr{animation:ag-fly 1s calc(.55s + var(--i)*.07s) cubic-bezier(.2,1.15,.35,1) both}
@keyframes ag-intro{from{transform:rotateX(16deg) rotateY(-60deg)}to{transform:rotateX(6deg) rotateY(-14deg)}}
@keyframes ag-idle{from{transform:rotateX(6deg) rotateY(-14deg)}to{transform:rotateX(2deg) rotateY(14deg)}}
@keyframes ag-grow{0%{transform:scale(0) rotateY(-540deg)}100%{transform:none}}
@keyframes ag-bob{0%,100%{transform:translateZ(0) rotateZ(0)}50%{transform:translateZ(60px) rotateZ(3deg)}}
@keyframes ag-fly{0%{transform:translate3d(0,260px,-1200px) rotateX(-95deg);opacity:0}35%{opacity:1}100%{transform:none;opacity:1}}
@keyframes ag-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#ag-splash .ag-sway,#ag-splash .ag-leaf,#ag-splash .ag-ltr,#ag-splash .ag-shadow{animation:none}#ag-splash .ag-sway{transform:rotateX(5deg) rotateY(-10deg)}}
</style>

<script>
(function(){
  var root=document.getElementById('ag-splash'),scene=document.getElementById('ag-scene');
  var MIN=2600, MAX=4500, start=Date.now(), isReady=false, hidden=false;
  var N=8, GAP=3.6;
  root.querySelectorAll('.ag-piece').forEach(function(p){
    for(var k=0;k<N;k++){
      var l=document.createElement('i'), t=k/(N-1);
      l.style.transform='translateZ('+((k-(N-1)/2)*GAP).toFixed(2)+'px)';
      l.style.filter='brightness('+(k===N-1?1.45:(0.5+0.35*t).toFixed(3))+')';
      p.appendChild(l);
    }
  });
  function fit(){ scene.style.transform='scale('+(window.innerWidth/1438)+')'; }
  fit(); window.addEventListener('resize',fit);
  function hide(){
    if(hidden) return; hidden=true; root.classList.add('ag-out');
    setTimeout(function(){ if(root.parentNode) root.parentNode.removeChild(root); },600);
    try{ window.dispatchEvent(new Event('agrivision:splash-done')); }catch(e){}
  }
  window.AgrivisionSplash={
    ready:function(){ isReady=true; setTimeout(hide,Math.max(0,MIN-(Date.now()-start))); },
    hide:hide
  };
  setTimeout(hide,MAX);
})();
</script>

<script>
window.addEventListener('agrivision:splash-done', function () {
  try {
    if (window.AgriSplashChannel &&
        typeof window.AgriSplashChannel.postMessage === 'function') {
      window.AgriSplashChannel.postMessage('done');
    }
  } catch (e) {}
});
</script>
