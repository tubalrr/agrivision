name: Flutter Android Build

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - "build_flutter.ps1"
      - ".github/workflows/flutter-android-build.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - "build_flutter.ps1"
      - ".github/workflows/flutter-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name=agrivision_flutter .

      - name: Resolve packages
        run: flutter pub get

      - name: Apply AgriVision branding
        run: dart run tool/apply_branding.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agrivision-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
