name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare optional release keystore
        if: ${{ secrets.AGRIVISION_RELEASE_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          AGRIVISION_RELEASE_KEYSTORE_BASE64: ${{ secrets.AGRIVISION_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$AGRIVISION_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agrivision-release.jks"
          echo "AGRIVISION_RELEASE_STORE_FILE=$RUNNER_TEMP/agrivision-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK (signed when secrets exist)
        env:
          AGRIVISION_RELEASE_STORE_PASSWORD: ${{ secrets.AGRIVISION_RELEASE_STORE_PASSWORD }}
          AGRIVISION_RELEASE_KEY_ALIAS: ${{ secrets.AGRIVISION_RELEASE_KEY_ALIAS }}
          AGRIVISION_RELEASE_KEY_PASSWORD: ${{ secrets.AGRIVISION_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agrivision-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
